name: LOCI Analysis
on:
  push:
    branches:
      - loci/main-*
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  loci:
    if: vars.UPSTREAM_REPO != ''
    # SPDK cannot cross-build its DPDK, so this builds natively on arm64.
    runs-on: ubuntu-24.04-arm

    env:
      # @configure: LOCI project name, the LOCI_PROJECT variable by default
      LOCI_PROJECT: '${{ vars.LOCI_PROJECT }}'
      LOCI_API_KEY: '${{ secrets.LOCI_API_KEY }}'
      LOCI_BACKEND_URL: '${{ vars.LOCI_BACKEND_URL }}'
      GH_TOKEN: ${{ secrets.MIRROR_REPOS_WRITE_PAT }}

    environment: ${{ vars.LOCI_ENV || 'PROD__AL_DEMO' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

      - name: Compute target
        id: target
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'loci/main-'))
        run: |
          branch="${{ github.ref_name }}"
          sha="${branch#loci/main-}"
          echo "value=main@${sha}" >> "$GITHUB_OUTPUT"

      - name: Compute base
        id: base
        if: github.event_name == 'pull_request'
        run: |
          git remote add upstream "https://github.com/${{ vars.UPSTREAM_REPO }}.git" 2>/dev/null || true   
          git fetch upstream                                                                               
          upstream_default=$(gh api "repos/${{ vars.UPSTREAM_REPO }}" --jq .default_branch)                
          merge_base=$(git merge-base HEAD "upstream/${upstream_default}")                                 
          short_sha="${merge_base:0:7}"                                                                    
          echo "value=main@${short_sha}" >> "$GITHUB_OUTPUT"                                               

      # @configure: Install build dependencies for your project
      - name: Install dependencies
        run: |
          git submodule update --init
          sudo scripts/pkgdep.sh
        shell: bash -euo pipefail {0}

      # @configure: Build your project binaries
      - name: Build
        run: |
          # The runner's CPU detection would tune DPDK for Neoverse N2; LOCI's aarch64 target is a Cortex-A53.
          echo 'DPDK_OPTS += -Dplatform=generic' >> dpdkbuild/Makefile
          source /var/spdk/dependencies/pip/bin/activate
          ./configure --target-arch=armv8-a --disable-tests --disable-unit-tests --disable-examples
          make -j"$(nproc)"
        shell: bash -euo pipefail {0}

      - name: Upload
        uses: auroralabs-loci/loci-action@v1
        with:
          mode: upload
          # @configure: List your binary paths/directories/globs 
          binaries: |
                build/bin/spdk_tgt
          project: '${{ env.LOCI_PROJECT }}'
          target: ${{ steps.target.outputs.value || ''}}
          base: ${{ steps.base.outputs.value || '' }}
